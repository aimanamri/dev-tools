server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;

    # Security headers. Keep these values the same as app/public/.htaccess.
    # Add Strict-Transport-Security on the server that terminates HTTPS.
    # nginx does not inherit add_header into a location that has its own add_header,
    # thus each location below includes the same file.
    include /etc/nginx/conf.d/security-headers.inc;

    # Pages with their own HTML (json/index.html), then the single-page app.
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html /index.html;
    }

    # The pdf.js worker is an ES module (.mjs). The default mime.types does not know .mjs,
    # and with "nosniff" the browser refuses a module that is not JavaScript.
    location ~* \.mjs$ {
        types { }
        default_type application/javascript;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # HTML, the service worker and the manifest must not stay in caches, so updates reach users.
    location ~* (^/sw\.js$|^/registerSW\.js$|\.html$|^/manifest\.webmanifest$) {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Files with a hash in the name do not change. Cache them for one year.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml application/manifest+json;
    gzip_min_length 1024;
}
