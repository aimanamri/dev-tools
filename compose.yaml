# Dev Tools production container.
#   docker compose up -d --build     then open http://localhost:8080
services:
  web:
    build:
      context: .
      args:
        VERSION: "1.2.0"
    image: dev-tools:latest
    container_name: dev-tools
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
